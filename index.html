<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>バス運転ゲーム</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none}
/* ---- 3Dシーン ---- */
#cam{position:fixed;inset:0;perspective:900px;perspective-origin:50% 62%;background:linear-gradient(#b9d3ea,#dfeaf3)}
#plane{position:absolute;left:50%;top:62%;width:0;height:0;transform-style:preserve-3d;transition:transform .6s,top .6s}
#mapRot{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
#map{position:absolute;width:2400px;height:2400px;left:-1200px;top:-1200px;background:#2a2a2a}
#fog{position:fixed;inset:0;z-index:500;pointer-events:none}
#bus{--bd:#f4f4f4;--st:#e8412c;position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;will-change:transform}
#bus.mt{--bd:#fff1b8;--st:#1b8a4a}
#box{position:absolute;left:calc(var(--W)/-2);top:calc(var(--L)/-2);width:var(--W);height:var(--L);transform-style:preserve-3d}
.f{position:absolute;overflow:visible}
.f svg{position:absolute;inset:0;width:100%;height:100%}
.bd{fill:var(--bd)}.st{fill:var(--st)}
.shadow{width:100%;height:100%;transform:translateZ(1px);background:rgba(0,0,0,.35);box-shadow:0 0 calc(var(--W)*.4) calc(var(--W)*.15) rgba(0,0,0,.35)}
.roof{width:100%;height:100%;transform:translateZ(var(--H))}
.wl,.wr{width:var(--H);height:100%;left:calc((var(--W) - var(--H))/2)}
.wl{transform:translateZ(calc(var(--H)/2)) rotateY(-90deg) translateZ(calc(var(--W)/2))}
.wr{transform:translateZ(calc(var(--H)/2)) rotateY(90deg) translateZ(calc(var(--W)/2))}
.wr svg{transform:scaleX(-1)}
.fr,.rr{width:100%;height:var(--H);top:calc((var(--L) - var(--H))/2);background:var(--bd);border-bottom:calc(var(--H)*.12) solid #2a2f35;box-sizing:border-box}
.fr{transform:translateZ(calc(var(--H)/2)) rotateX(90deg) translateZ(calc(var(--L)/2)) scaleY(-1)}
.rr{transform:translateZ(calc(var(--H)/2)) rotateX(-90deg) translateZ(calc(var(--L)/2))}
.rw,.wsh{position:absolute;left:8%;right:8%;background:#2b3a4a;border-radius:3px}
.rw{top:10%;height:34%}.wsh{top:8%;height:42%}
.lamp{position:absolute;border-radius:2px}
.sL,.sR{background:#6e4300;fill:#6e4300}
body.lampL .sL,body.lampR .sR{background:#ffae00;fill:#ffae00;box-shadow:0 0 8px 3px #ffae00}
.bl{background:#6a1010;fill:#6a1010}body.brk .bl{background:#ff2a2a;box-shadow:0 0 8px 3px #f22}
.hl{background:#fff3b0}
.rdF,.rdR{fill:transparent}#bus.dFo .rdF,#bus.dRo .rdR{fill:#ff9a00}
.door{position:absolute;left:13.3%;width:73.4%;background:linear-gradient(#26303a,#0f1318)}
#doorF{top:6%;height:13%}#doorR{top:56%;height:16%}
.lf{position:absolute;left:0;width:100%;height:50%;box-sizing:border-box;background:linear-gradient(90deg,#7fb2d0,#a7d2e8);outline:1px solid #34495e;transition:transform .9s ease}
.lf.a{top:0;transform-origin:50% 0}.lf.b{bottom:0;transform-origin:50% 100%}
.door.open .lf{transform:scaleY(.1)}
/* ---- UI ---- */
#top{position:fixed;z-index:1000;top:0;left:0;right:62px;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 0 8px;display:flex;flex-direction:column;gap:6px;max-width:520px}
#top form{display:flex;gap:6px}
#q{flex:1;min-width:0;font-size:16px;padding:10px 12px;border:0;border-radius:10px;background:rgba(255,255,255,.95);-webkit-user-select:text;user-select:text}
button{font:inherit;border:0;border-radius:10px;padding:10px 12px;background:rgba(20,30,45,.85);color:#fff;cursor:pointer;touch-action:none}
button:active,button.on{background:#e8412c}
#res{background:rgba(255,255,255,.96);border-radius:10px;overflow:hidden;display:none}
#res div{padding:10px 12px;font-size:14px;color:#222;border-bottom:1px solid #ddd;cursor:pointer}
#res div:last-child{border:0}
#ctl{display:flex;gap:4px;flex-wrap:wrap}
#ctl button{padding:8px 9px;font-size:13px;min-width:38px}
#hint{color:#123;font-size:12px;text-shadow:0 0 4px #fff,0 0 6px #fff}
#side{position:fixed;z-index:1000;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:column;gap:6px}
#side button{width:46px;padding:10px 0;font-size:18px}
#hud{position:fixed;z-index:1000;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:6px;align-items:stretch;pointer-events:none;color:#fff}
#hud>div{background:rgba(20,30,45,.88);border-radius:12px;padding:4px 10px;text-align:center}
#hud>.ar{background:none;padding:0;align-self:center;font-size:28px;color:#3c5;opacity:.2;text-shadow:0 0 6px #000}
body.lampL #aL,body.lampR #aR{opacity:1}
#hud small{display:block;font-size:10px;opacity:.7;letter-spacing:.1em}
#gd{font:700 30px/1.1 ui-monospace,Menlo,Consolas,monospace;color:#ffb000;background:#000;border-radius:6px;padding:0 8px;min-width:50px;text-shadow:0 0 8px #ff8c00;border:2px solid #444}
#spd{font-size:24px;font-weight:700;min-width:84px}
#spd small{display:inline;font-size:11px;margin-left:3px}
#rb{width:74px;font-size:13px}
#rbar{height:8px;background:#333;border-radius:4px;overflow:hidden;margin-top:4px}
#rfill{height:100%;width:0;background:#6c6}
#shift{position:fixed;z-index:1000;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 82px)}
body.touch #shift{bottom:calc(env(safe-area-inset-bottom,0px) + 170px)}
#shift>div{display:none;gap:8px}
#shift button{min-width:56px;height:48px;font-size:18px;font-weight:700;background:rgba(20,30,45,.78);border:2px solid rgba(255,255,255,.55)}
#pad{position:fixed;z-index:1000;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 76px);display:none;justify-content:space-between;pointer-events:none}
#pad .grp{display:flex;gap:14px;pointer-events:auto}
#pad .k{width:84px;height:84px;border-radius:50%;font-size:34px;padding:0;background:rgba(20,30,45,.55);border:2px solid rgba(255,255,255,.6)}
.k.on,#shift button.on{background:rgba(232,65,44,.9)}
#toast{position:fixed;z-index:1100;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 16px;border-radius:10px;display:none;font-size:14px;text-align:center;pointer-events:none}
#splash{position:fixed;z-index:2000;inset:0;background:linear-gradient(#1c3550,#0b1622);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#splash h1{margin:0;font-size:28px}#splash p{margin:0;font-size:13px;opacity:.8;max-width:340px;line-height:1.6}
#go{font-size:20px;padding:14px 40px;background:#e8412c}
</style>
</head>
<body>
<div id="cam"><div id="plane">
  <div id="mapRot"><div id="map"></div></div>
  <div id="bus"><div id="box"></div></div>
</div></div>
<div id="fog"></div>

<div id="top">
  <form id="f"><input id="q" placeholder="場所を検索（例：渋谷駅、東京タワー）" autocomplete="off"><button type="submit">検索</button><button type="button" id="geo">📍</button></form>
  <div id="res"></div>
  <div id="ctl">
    <button data-s="sigL">◀</button><button data-s="haz">⚠</button><button data-s="sigR">▶</button>
    <button data-s="doorF">前ドア閉</button><button data-s="doorR">後ドア閉</button><button data-s="view">🎥</button>
  </div>
  <div id="hint"></div>
</div>
<div id="side">
  <button data-s="mode">📱</button><button data-s="veh">🚌</button><button data-s="eng">🔑</button>
  <button data-s="snd" id="snd">🔊</button><button data-s="zi">＋</button><button data-s="zo">－</button>
</div>
<div id="shift">
  <div id="atsel"><button data-s="R">R</button><button data-s="N">N</button><button data-s="D">D</button></div>
  <div id="mtsel"><button data-s="sd">▼</button><button data-s="su">▲</button><button data-k="clutch">クラッチ</button></div>
</div>
<div id="hud">
  <div class="ar" id="aL">◀</div>
  <div><small id="gl">ALLISON</small><div id="gd">N</div></div>
  <div id="spd"><span id="sv">0</span><small>km/h</small></div>
  <div id="rb"><span id="rv">700</span><small style="display:inline"> rpm</small><div id="rbar"><div id="rfill"></div></div></div>
  <div class="ar" id="aR">▶</div>
</div>
<div id="pad">
  <div class="grp"><button class="k" data-k="left">◀</button><button class="k" data-k="right">▶</button></div>
  <div class="grp"><button class="k" data-k="down">■</button><button class="k" data-k="up">▲</button></div>
</div>
<div id="toast"></div>
<div id="splash"><h1>🚌 バス運転ゲーム</h1>
  <p>ボタンを押すとエンジン音が有効になります。<br>iPhone / iPad は本体のマナーモード（サイレントスイッチ）を解除してください。</p>
  <button id="go">スタート</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const ad=(a,b)=>((a-b+540)%360+360)%360-180;
// ===== 車種 =====
const VEH={
  at:{name:'ALLISON AT バス（6速オートマ）',lab:'ALLISON',len:12,wid:3,hgt:3.1,r0:11,cyl:3,gmax:[14,26,42,60,80,100],acc:[2.6,2.1,1.6,1.2,.9,.65],rmax:10,racc:1.5},
  mt:{name:'MT バス（6速マニュアル）',lab:'MT',len:9,wid:2.6,hgt:2.9,r0:8,cyl:2,gmax:[12,24,38,55,72,90],acc:[2.4,1.9,1.4,1.0,.75,.55],rmax:9,racc:1.4}
};
const IDLE=700;
let cur='at',sel='N',ag=1,gear=0,shiftT=0,cl=0,bl=0,rpm=IDLE,engineOn=true,stallT=0,soundOn=true;
let pos={lat:35.6595,lng:139.7005},heading=0,camH=0,v=0,steer=0,zoom=20;
let sig=0,sigH=0,sigDone=false,lastPh=-1,door={F:false,R:false},warned=false,vi=0;
const keys={up:false,down:false,left:false,right:false,brake:false,clutch:false},tk={up:false,down:false,left:false,right:false,clutch:false};
const K=k=>keys[k]||tk[k];
let mode='touch';
try{mode=localStorage.getItem('busMode')||(matchMedia('(pointer:coarse)').matches?'touch':'pc');}catch(e){mode=matchMedia('(pointer:coarse)').matches?'touch':'pc';}

// ===== 地図（Google衛星画像） =====
const map=L.map('map',{zoomControl:false,dragging:false,scrollWheelZoom:false,touchZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false,attributionControl:false});
L.tileLayer('https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{subdomains:'0123',maxNativeZoom:20,maxZoom:21,keepBuffer:2}).addTo(map);
map.setView([pos.lat,pos.lng],zoom,{animate:false});

// ===== 3Dバス =====
const bus=$('bus');
const wallSvg='<svg viewBox="0 0 30 100" preserveAspectRatio="none"><rect class="bd" width="30" height="100"/><rect fill="#2a2f35" width="4" height="100"/><rect class="st" x="5" width="1.6" height="100"/><rect x="14" y="3" width="12" height="94" fill="#2b3a4a"/>'
 +[17,31,45,59,73,87].map(y=>'<rect class="bd" x="14" y="'+y+'" width="12" height="1.4"/>').join('')+'</svg>';
const lamps=c=>'<i class="lamp '+c+'" style="left:40%;top:1%;width:12%;height:3%"></i><i class="lamp '+c+'" style="left:40%;top:96%;width:12%;height:3%"></i>';
const door_=id=>'<div class="door" id="'+id+'"><div class="lf a"></div><div class="lf b"></div></div>';
$('box').innerHTML=
 '<div class="f shadow"></div>'
+'<div class="f roof"><svg viewBox="0 0 30 100" preserveAspectRatio="none"><rect class="bd" x="0" y="0" width="30" height="100" rx="4"/><rect x="2" y="9" width="26" height="82" rx="3" fill="#e6ecf1" stroke="#b6c1cb" stroke-width=".6"/><rect class="st" x="14" y="12" width="2" height="76"/><rect x="8.5" y="28" width="13" height="10" rx="1" fill="#c6d0d8"/><rect x="8.5" y="54" width="13" height="10" rx="1" fill="#c6d0d8"/><path d="M3 3.5H27L26 9H4Z" fill="#2b3a4a"/><rect x="5" y="92" width="20" height="4" rx="1" fill="#2b3a4a"/><rect class="rdF" x="0" y="6" width="2.2" height="13"/><rect class="rdR" x="0" y="56" width="2.2" height="16"/><circle class="sL" cx="3.5" cy="2.6" r="1.8"/><circle class="sR" cx="26.5" cy="2.6" r="1.8"/><circle class="sL" cx="3.5" cy="97.4" r="1.8"/><circle class="sR" cx="26.5" cy="97.4" r="1.8"/></svg></div>'
+'<div class="f wl">'+wallSvg+lamps('sL')+door_('doorF')+door_('doorR')+'</div>'
+'<div class="f wr">'+wallSvg+lamps('sR')+'</div>'
+'<div class="f fr"><b class="wsh"></b><i class="lamp sL" style="left:1%;top:62%;width:9%;height:13%"></i><i class="lamp hl" style="left:12%;top:62%;width:14%;height:13%"></i><i class="lamp hl" style="right:12%;top:62%;width:14%;height:13%"></i><i class="lamp sR" style="right:1%;top:62%;width:9%;height:13%"></i></div>'
+'<div class="f rr"><b class="rw"></b><i class="lamp sL" style="left:1%;top:62%;width:9%;height:13%"></i><i class="lamp bl" style="left:12%;top:62%;width:14%;height:13%"></i><i class="lamp bl" style="right:12%;top:62%;width:14%;height:13%"></i><i class="lamp sR" style="right:1%;top:62%;width:9%;height:13%"></i></div>';
function sizeBus(){
  const V=VEH[cur],mpp=156543.03392*Math.cos(pos.lat*Math.PI/180)/Math.pow(2,zoom),s=bus.style;
  s.setProperty('--W',V.wid/mpp+'px');s.setProperty('--L',V.len/mpp+'px');s.setProperty('--H',V.hgt/mpp+'px');
}
function setZoom(z){zoom=Math.max(17,Math.min(21,z));sizeBus();}
function toast(t){const el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',1800);}

// ===== 視点 =====
const VIEWS=[{n:'3D追従',tilt:58,yaw:0,follow:1},{n:'3D 左側面（ドア確認）',tilt:58,yaw:-32,follow:1},{n:'真上（進行方向）',tilt:0,yaw:0,follow:1},{n:'真上（北固定）',tilt:0,yaw:0,follow:0}];
function applyView(){
  const V=VIEWS[vi],top=V.tilt?62:54;
  $('plane').style.transform='rotateX('+V.tilt+'deg)';$('plane').style.top=top+'%';
  $('cam').style.perspectiveOrigin='50% '+top+'%';
  if(V.tilt){
    const h=innerHeight,p=900,D=1200,th=V.tilt*Math.PI/180;
    const yf=top/100*h-D*Math.cos(th)*p/(p+D*Math.sin(th)),s=Math.max(0,yf/h*100)+3;
    $('fog').style.background='linear-gradient(#b9d3ea '+s+'%,rgba(185,211,234,0) '+(s+26)+'%)';
  }else $('fog').style.background='none';
}
addEventListener('resize',applyView);

// ===== ギア =====
const MT_SEQ=[-1,0,1,2,3,4,5,6];
function pickGear(){const vk=Math.abs(v)*3.6;for(let g=1;g<=6;g++)if(vk/VEH.at.gmax[g-1]*2400<1800)return g;return 6;}
function setSel(s){
  if(cur!=='at')return;
  if(s==='R'&&v>1.4)return toast('停止してからR（後退）に入れてください');
  if(s==='D'&&v<-1.4)return toast('停止してからD（前進）に入れてください');
  sel=s;if(s==='D'){ag=pickGear();shiftT=.5;}updSel();
}
function setMT(n){if(n===gear)return;if(n!==0&&cl<.6)return toast('クラッチを踏んでからシフト！');gear=n;}
function shift(d){
  if(cur==='at'){const o=['R','N','D'];setSel(o[Math.max(0,Math.min(2,o.indexOf(sel)+d))]);}
  else setMT(MT_SEQ[Math.max(0,Math.min(7,MT_SEQ.indexOf(gear)+d))]);
}
function updSel(){document.querySelectorAll('#atsel button').forEach(b=>b.classList.toggle('on',b.dataset.s===sel));}
function toggleEngine(){
  if(engineOn){engineOn=false;return toast('エンジン停止');}
  if(cur==='at'&&sel!=='N')return toast('N（ニュートラル）で始動してください');
  if(cur==='mt'&&gear!==0&&cl<.6)return toast('ニュートラルか、クラッチを踏んで始動');
  engineOn=true;rpm=IDLE;toast('エンジン始動');
}
function setVeh(k){
  cur=k;v=0;sel='N';gear=0;ag=1;cl=0;engineOn=true;rpm=IDLE;
  bus.classList.toggle('mt',k==='mt');$('gl').textContent=VEH[k].lab;
  $('atsel').style.display=k==='at'?'flex':'none';$('mtsel').style.display=k==='mt'?'flex':'none';
  sizeBus();updSel();toast(VEH[k].name);
}

// ===== ウィンカー・ドア =====
function setSig(s){
  sig=sig===s?0:s;sigH=heading;sigDone=false;lastPh=-1;
  document.querySelector('[data-s=sigL]').classList.toggle('on',sig===-1);
  document.querySelector('[data-s=sigR]').classList.toggle('on',sig===1);
  document.querySelector('[data-s=haz]').classList.toggle('on',sig===2);
  if(!sig){document.body.classList.remove('lampL','lampR');}
}
function toggleDoor(k){
  if(!door[k]&&Math.abs(v)>.8)return toast('停車してからドアを開けてください');
  door[k]=!door[k];$('door'+k).classList.toggle('open',door[k]);bus.classList.toggle('d'+k+'o',door[k]);
  const b=document.querySelector('[data-s=door'+k+']');b.classList.toggle('on',door[k]);
  b.textContent=(k==='F'?'前ドア':'後ドア')+(door[k]?'開':'閉');whoosh();
}

// ===== 操作の割り当て =====
const ACT={R:()=>setSel('R'),N:()=>setSel('N'),D:()=>setSel('D'),su:()=>shift(1),sd:()=>shift(-1),
  sigL:()=>setSig(-1),sigR:()=>setSig(1),haz:()=>setSig(2),doorF:()=>toggleDoor('F'),doorR:()=>toggleDoor('R'),
  view:()=>{vi=(vi+1)%VIEWS.length;applyView();toast('視点：'+VIEWS[vi].n);},
  veh:()=>setVeh(cur==='at'?'mt':'at'),eng:toggleEngine,
  snd:()=>{soundOn=!soundOn;$('snd').textContent=soundOn?'🔊':'🔇';},
  zi:()=>setZoom(zoom+1),zo:()=>setZoom(zoom-1),
  mode:()=>{mode=mode==='touch'?'pc':'touch';applyMode();toast(mode==='touch'?'タッチ操作モード':'キーボード操作モード');}};
const act=s=>{unlock();if(ACT[s])ACT[s]();};
const kmap={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'brake',ShiftLeft:'clutch',ShiftRight:'clutch'};
addEventListener('keydown',e=>{
  unlock();
  if(mode!=='pc'||document.activeElement.tagName==='INPUT')return;
  const k=kmap[e.code];if(k){keys[k]=true;e.preventDefault();return;}
  if(e.repeat)return;const c=e.code;
  if(c==='KeyE')shift(1);else if(c==='KeyQ')shift(-1);
  else if(c==='KeyZ'){cur==='at'?setSel('R'):setMT(-1);}
  else if(c==='KeyX'){cur==='at'?setSel('N'):setMT(0);}
  else if(c==='KeyC'&&cur==='at')setSel('D');
  else if(cur==='mt'&&/^Digit[1-6]$/.test(c))setMT(+c[5]);
  else if(c==='Enter')toggleEngine();
  else if(c==='KeyJ')ACT.sigL();else if(c==='KeyL')ACT.sigR();else if(c==='KeyK')ACT.haz();
  else if(c==='KeyF')ACT.doorF();else if(c==='KeyG')ACT.doorR();else if(c==='KeyV')ACT.view();
});
addEventListener('keyup',e=>{const k=kmap[e.code];if(k)keys[k]=false;});

// ----- マルチタッチ（複数ボタン同時押し・指をスライドしても追従） -----
const HOLD=['up','down','left','right','clutch'];
function scan(e){
  const on={};
  for(const t of e.touches){
    const el=document.elementFromPoint(t.clientX,t.clientY),b=el&&el.closest('[data-k]');
    if(b)on[b.dataset.k]=true;
  }
  HOLD.forEach(k=>tk[k]=!!on[k]);
  document.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('on',!!on[b.dataset.k]||keys[b.dataset.k]));
}
function onTouch(e){
  const hit=e.target.closest&&e.target.closest('[data-k],[data-s]');
  if(e.type==='touchstart'){
    for(const t of e.changedTouches){
      const el=document.elementFromPoint(t.clientX,t.clientY),s=el&&el.closest('[data-s]');
      if(s)act(s.dataset.s);
    }
  }
  scan(e);
  if(hit||HOLD.some(k=>tk[k]))e.preventDefault();
}
['touchstart','touchmove','touchend','touchcancel'].forEach(t=>document.addEventListener(t,onTouch,{passive:false}));
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
// マウス
let mouseK=null;
addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'||!e.target.closest)return;
  const s=e.target.closest('[data-s]');if(s){act(s.dataset.s);return;}
  const k=e.target.closest('[data-k]');if(k){mouseK=k.dataset.k;keys[mouseK]=true;k.classList.add('on');}
});
addEventListener('pointerup',()=>{if(mouseK){keys[mouseK]=false;document.querySelectorAll('[data-k]').forEach(b=>b.classList.remove('on'));mouseK=null;}});

function applyMode(){
  for(const k in keys)keys[k]=false;
  $('pad').style.display=mode==='touch'?'flex':'none';
  document.body.classList.toggle('touch',mode==='touch');
  document.querySelector('[data-s=mode]').textContent=mode==='touch'?'📱':'⌨️';
  $('hint').textContent=mode==='touch'
    ?'左：ハンドル／右：■ブレーキ ▲アクセル（同時押しOK）／中央：シフト'
    :'↑↓ アクセル/ブレーキ ←→ ハンドル Space 駐車ブレーキ | J/L/K ウィンカー/ハザード | F/G 前/後ドア | V 視点 | AT: Z/X/C=R/N/D | MT: Shift=クラッチ Q/E・1-6 | Enter=始動';
  try{localStorage.setItem('busMode',mode);}catch(e){}
}

// ===== 検索 =====
const res=$('res');
function place(lat,lng,name){
  pos={lat:+lat,lng:+lng};v=0;steer=0;res.style.display='none';
  sizeBus();map.setView([pos.lat,pos.lng],zoom,{animate:false});
  if(name)toast('📍 '+name.split(',').slice(0,2).join(','));$('q').blur();
}
$('f').addEventListener('submit',async e=>{
  e.preventDefault();const q=$('q').value.trim();if(!q)return;
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=ja&q='+encodeURIComponent(q));
    const list=await r.json();res.innerHTML='';
    if(!list.length)res.innerHTML='<div>見つかりませんでした</div>';
    list.forEach(it=>{const d=document.createElement('div');d.textContent=it.display_name;d.onclick=()=>place(it.lat,it.lon,it.display_name);res.appendChild(d);});
    res.style.display='block';
  }catch(err){toast('検索に失敗しました（ネット接続を確認）');}
});
$('geo').onclick=()=>{
  if(!navigator.geolocation)return toast('位置情報が使えません');
  navigator.geolocation.getCurrentPosition(p=>place(p.coords.latitude,p.coords.longitude,'現在地'),()=>toast('現在地を取得できませんでした'));
};

// ===== 音（Web Audio） =====
let AC=null,mg,flt,oscs=[],nbuf;
function initAudio(){
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    const mix=AC.createGain(),sh=AC.createWaveShaper(),comp=AC.createDynamicsCompressor(),c=new Float32Array(1024);
    for(let i=0;i<1024;i++)c[i]=Math.tanh((i/512-1)*3);sh.curve=c;
    flt=AC.createBiquadFilter();flt.type='lowpass';flt.frequency.value=700;flt.Q.value=1;
    mg=AC.createGain();mg.gain.value=0;
    oscs=[['sawtooth',1,.5],['square',.5,.35],['sawtooth',2.01,.3],['sawtooth',4.02,.22],['sawtooth',8.03,.14]].map(([ty,m,gv])=>{
      const o=AC.createOscillator(),g=AC.createGain();o.type=ty;g.gain.value=gv;o.connect(g).connect(mix);o.start();return{o,m};});
    nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const n=AC.createBufferSource();n.buffer=nbuf;n.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=250;
    const ng=AC.createGain();ng.gain.value=.12;n.connect(bp).connect(ng).connect(mix);n.start();
    mix.connect(sh);sh.connect(flt);flt.connect(mg);mg.connect(comp);comp.connect(AC.destination);
  }catch(e){AC=null;}
}
function unlock(){
  if(!AC)initAudio();
  if(AC&&AC.state!=='running')AC.resume();
}
['touchend','click','pointerup','mousedown'].forEach(t=>addEventListener(t,unlock,{passive:true}));
$('go').onclick=()=>{unlock();$('splash').style.display='none';toast('Dで発進 / 🎥で視点切替');};
function updAudio(thr){
  if(!AC||AC.state!=='running')return;
  const t=AC.currentTime,f=Math.max(8,rpm/60*VEH[cur].cyl);
  oscs.forEach(x=>x.o.frequency.setTargetAtTime(f*x.m,t,.04));
  flt.frequency.setTargetAtTime(500+rpm*.8+thr*700,t,.08);
  const on=engineOn&&soundOn&&rpm>150;
  mg.gain.setTargetAtTime(on?.35+.25*thr+rpm/2400*.2:0,t,.08);
}
function blip(on){
  if(!AC||AC.state!=='running'||!soundOn)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='square';o.frequency.value=on?1500:1100;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.045);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.06);
}
function whoosh(){
  if(!AC||AC.state!=='running'||!soundOn)return;
  const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nbuf;f.type='bandpass';f.frequency.setValueAtTime(2500,t);f.frequency.exponentialRampToValueAtTime(700,t+.7);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.8);
  s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+.9);
}

// ===== ゲームループ =====
let last=performance.now(),lastG='',lastS='',lL=false,lR=false,lB=false;
function tick(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  const V=VEH[cur],AT=cur==='at',doorOpen=door.F||door.R;
  let thr=(K('up')&&engineOn)?1:0;
  if(doorOpen){if(thr&&!warned){toast('ドアが開いています（閉めると発進できます）');warned=true;}thr=0;}
  if(!K('up'))warned=false;
  bl+=((K('down')||doorOpen?1:0)-bl)*Math.min(1,dt*(K('down')?4:12));
  if(doorOpen)bl=Math.max(bl,.8);
  if(AT)cl=0;else{cl+=K('clutch')?6*dt:-1.6*dt;cl=Math.max(0,Math.min(1,cl));}
  const e=AT?1:1-cl;
  let eg;
  if(AT){
    if(sel==='D'){
      shiftT-=dt;
      if(shiftT<=0&&engineOn){
        const wr=Math.max(0,v)*3.6/V.gmax[ag-1]*2400;
        if(ag<6&&wr>1600+thr*600){ag++;shiftT=.8;}
        else if(ag>1){const lo=thr>.9?1100:650,wd=Math.max(0,v)*3.6/V.gmax[ag-2]*2400;if(wr<lo&&wd<2200){ag--;shiftT=.6;}}
      }
      eg=ag;
    }else eg=sel==='R'?-1:0;
  }else eg=gear;
  const dir=eg>0?1:eg<0?-1:0,gm=eg>0?V.gmax[eg-1]:V.rmax,wv=v*dir;
  const wrpm=eg===0?0:Math.max(0,wv)*3.6/gm*2400,coupled=eg!==0&&engineOn;
  let target;
  if(!engineOn)target=0;
  else if(eg===0)target=IDLE+thr*1700;
  else if(AT){const slip=Math.max(0,1-Math.abs(v)*3.6/20);target=Math.max(wrpm,IDLE+thr*900*slip);}
  else{const free=IDLE+thr*1700;target=free+(wrpm-free)*e;}
  rpm+=(target-rpm)*Math.min(1,dt*(target>rpm?5:3));rpm=Math.min(rpm,2500);
  if(!AT&&engineOn&&!doorOpen&&eg!==0&&e>.9&&rpm<420){stallT+=dt;if(stallT>.35){engineOn=false;toast('エンジンストール！ 🔑 / Enterで再始動');}}else stallT=0;
  let a=0;
  if(coupled&&e>0){
    const A=eg>0?V.acc[eg-1]:V.racc,lug=Math.max(.15,Math.min(1,(rpm-450)/450));
    if(wrpm<2380)a+=dir*thr*A*e*lug;
    if(AT&&thr===0&&!doorOpen)a+=dir*1.2*Math.max(0,1-wv/1.4);
    if(thr===0&&Math.abs(v)>.3&&!(AT&&wv<2))a-=Math.sign(v)*(.4+rpm/2400*.9)*e;
    if(wrpm>2400)a-=Math.sign(v)*Math.min(8,(wrpm-2400)/2400*14)*e;
  }else if(!engineOn&&eg!==0&&e>.5)a-=Math.sign(v)*3*e;
  a-=Math.sign(v)*.3+v*Math.abs(v)*.0012;
  v+=a*dt;
  const db=5.5*bl+(keys.brake?6:0);
  if(db>0&&v!==0)v-=Math.sign(v)*Math.min(Math.abs(v),db*dt);
  if(Math.abs(v)<.02&&thr===0&&a*Math.sign(v||1)<.5&&(bl>0||eg===0))v=0;
  const tg=(K('right')?1:0)-(K('left')?1:0);
  steer+=(tg-steer)*Math.min(1,dt*6);
  heading+=(v/(V.r0+Math.abs(v)*.9)*steer)*dt*180/Math.PI;heading=((heading%360)+360)%360;
  const d=v*dt,h=heading*Math.PI/180;
  pos.lat+=d*Math.cos(h)/111320;pos.lng+=d*Math.sin(h)/(111320*Math.cos(pos.lat*Math.PI/180));
  map.setView([pos.lat,pos.lng],zoom,{animate:false});
  // カメラ：バスの向きに追従（少し遅れて回り込む）
  camH+=ad(heading,camH)*Math.min(1,dt*3.5);
  const VW=VIEWS[vi],rel=ad(heading,camH);
  $('mapRot').style.transform='rotateZ('+(VW.follow?-camH:0)+'deg)';
  bus.style.transform='rotateZ('+(VW.follow?rel+VW.yaw:heading)+'deg)';
  // ウィンカー
  const ph=((t/330)|0)%2===0;
  if(sig){
    if(sig!==2){if(Math.abs(ad(heading,sigH))>40)sigDone=true;if(sigDone&&Math.abs(steer)<.2)setSig(sig);}
    if(sig&&ph!==lastPh){lastPh=ph;blip(ph);}
  }
  const nL=!!sig&&ph&&(sig===-1||sig===2),nR=!!sig&&ph&&(sig===1||sig===2),nB=bl>.08||keys.brake;
  if(nL!==lL){lL=nL;document.body.classList.toggle('lampL',nL);}
  if(nR!==lR){lR=nR;document.body.classList.toggle('lampR',nR);}
  if(nB!==lB){lB=nB;document.body.classList.toggle('brk',nB);}
  // 表示
  let g;
  if(!engineOn)g='OFF';else if(AT)g=sel==='D'?'D'+ag:sel;else g=gear===-1?'R':gear===0?'N':String(gear);
  if(g!==lastG){$('gd').textContent=g;lastG=g;}
  const sp=String(Math.round(Math.abs(v)*3.6));if(sp!==lastS){$('sv').textContent=sp;lastS=sp;}
  $('rv').textContent=Math.round(rpm/10)*10;
  const rf=$('rfill');rf.style.width=Math.min(100,rpm/2500*100)+'%';rf.style.background=rpm>2200?'#e55':rpm>1800?'#ec4':'#6c6';
  updAudio(thr);
  requestAnimationFrame(tick);
}
setVeh('at');applyMode();applyView();requestAnimationFrame(tick);
</script>
